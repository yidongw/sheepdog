name: sheepdog review

# The reusable trusted tests + commit gates + blocking agent review for one pushed commit.
#
# A repository adopts it with a small caller workflow on its default branch (examples/caller-review.yml):
#
#   on: workflow_run: {workflows: [CI], types: [requested]}
#   jobs:
#     sheepdog:
#       uses: yidongw/sheepdog/.github/workflows/review.yml@<40-char commit sha>
#       with: {...}
#
# Trust model (docs/contract.md):
#  - workflow_run always runs the caller workflow as it is on the DEFAULT branch, so a branch cannot change what tests or
#    reviews it, and the caller pins this file by a full commit sha (verified below: a tag or branch ref is refused).
#  - The pushed commit is checked out as DATA (./candidate). No job that holds a write token runs its code: the `tests`
#    job runs it with a read-only token; the `review` job only diffs it and hands it to the isolated reviewer
#    (reviewer/: read-only container, no network except a relay to the model endpoint, no credentials).
#  - Gate and reviewer code come from this repository at the pinned sha (./.sheepdog). Repository-specific trusted
#    files (an extra gate, SHA-bound Verify records) come from the caller's default branch (./.trusted).
#  - The run is identified by the CALLER's workflow file: scripts/ci/review-runs.sh accepts only workflow_run runs of
#    the default branch's .github/workflows/review.yml. Jobs of a called workflow are named "<caller job> / <job>"
#    (e.g. "sheepdog / review"); every reader matches the job name with or without that prefix.
#
# Run title (set by the caller: run-name): `recheck <sha>` for a default-branch head, `review <sha>` otherwise.
#
# Which heads run what (the review contract, docs/contract.md):
#  - dev and devfix/* pushes: tests; dev pushes: review.
#  - default-branch heads carrying Hotfix:, Train-Merge: or Review-Fix-Of: trailers: tests and a review of everything
#    since the last completed default-branch review (one reviewer at a time: job-level concurrency below).
#  - a plain fast-forward of the default branch to a reviewed dev sha: nothing (its dev run was the proof).

on:
  workflow_call:
    inputs:
      main-branch:
        description: The default branch (where the caller workflow runs from), e.g. main or master.
        type: string
        default: main
      dev-branch:
        description: The shared integration branch every change lands on before the default branch.
        type: string
        default: dev
      tests-runs-on:
        description: JSON runs-on value for the trusted tests of dev / devfix heads (e.g. '["self-hosted","ci"]').
        type: string
        required: true
      tests-runs-on-main:
        description: JSON runs-on value for the trusted tests of default-branch heads; empty = tests-runs-on.
        type: string
        default: ""
      review-runs-on:
        description: JSON runs-on value for the review and status jobs (a host with docker, the reviewer CLI and its model relay).
        type: string
        required: true
      tests-script:
        description: Path, on the caller's default branch, of the bash script that runs the trusted tests in the candidate checkout.
        type: string
        default: .github/sheepdog/tests.sh
      tests-timeout-minutes:
        type: number
        default: 60
      review-timeout-minutes:
        type: number
        default: 90
      node-version:
        description: Node.js for the tests ('' = do not set up node). The reviewer itself always uses node 24.
        type: string
        default: "24"
      bun-version:
        description: Bun for the tests ('' = no bun).
        type: string
        default: ""
      go-version:
        description: Go for the tests ('' = no go; the module cache is not restored or saved — a candidate cannot poison a cache).
        type: string
        default: ""
      large-files-allowed:
        description: Paths (one per line, exact) where the commit gate admits a binary over 1 MB, e.g. a vendored binary the repository ships on purpose. Read from the caller's default branch like every input.
        type: string
        default: ""
      extra-gates:
        description: Path, on the caller's default branch, of an extra commit gate run as `bash <path> <base> <head>` in the candidate. Adds to the built-in gates, never replaces them.
        type: string
        default: ""
      verification-dir:
        description: Directory, on the caller's default branch, of SHA-bound Verify records (<sha>.txt) for published commits.
        type: string
        default: scripts/ci/commit-verification
      open-findings-file:
        description: Path on the review runner of the dispatcher's open-findings log ('' = none). Findings listed there do not block again when a range only repeats them.
        type: string
        default: ""
      reviewer-env-file:
        description: Path on the review runner of a KEY=VALUE file with the reviewer's settings (CODEREVIEW_*); '' = the runner environment only.
        type: string
        default: ""
      sheepdog-repository:
        description: The repository this workflow is called from (a fork of sheepdog sets its own).
        type: string
        default: yidongw/sheepdog

permissions: {}

env:
  SHA: ${{ github.event.workflow_run.head_sha }}
  HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
  MAIN_BRANCH: ${{ inputs.main-branch }}
  DEV_BRANCH: ${{ inputs.dev-branch }}

jobs:
  tests:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.head_branch == inputs.dev-branch || startsWith(github.event.workflow_run.head_branch, format('{0}fix/', inputs.dev-branch)) ||
       (github.event.workflow_run.head_branch == inputs.main-branch && (contains(github.event.workflow_run.head_commit.message, 'Hotfix: ') || contains(github.event.workflow_run.head_commit.message, 'Train-Merge: ') || contains(github.event.workflow_run.head_commit.message, 'Review-Fix-Of: '))))
    runs-on: ${{ fromJSON(github.event.workflow_run.head_branch == inputs.main-branch && inputs.tests-runs-on-main != '' && inputs.tests-runs-on-main || inputs.tests-runs-on) }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.tests-timeout-minutes }}
    steps:
      - name: Clean workspace (a self-hosted workspace keeps files between runs)
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      # The caller's default branch: the tests script, and the trusted files it may use (guards, a test harness, configs)
      # as $SHEEPDOG_TRUSTED — moved out of the workspace before the candidate is checked out. The script decides
      # what runs before candidate code can touch them (it runs as the same user on a hosted runner).
      - name: Trusted tree (the caller's default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.main-branch }}
          path: .sheepdog-trusted
          persist-credentials: false
      - name: Keep the trusted tree outside the candidate's workspace
        run: |
          rm -rf "$RUNNER_TEMP/sheepdog-trusted"
          mv .sheepdog-trusted "$RUNNER_TEMP/sheepdog-trusted"
          install -m 0755 "$RUNNER_TEMP/sheepdog-trusted/$TESTS_SCRIPT" "$RUNNER_TEMP/sheepdog-tests.sh"
          echo "SHEEPDOG_TRUSTED=$RUNNER_TEMP/sheepdog-trusted" >> "$GITHUB_ENV"
        env:
          TESTS_SCRIPT: ${{ inputs.tests-script }}
      - name: Candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.go-version != ''
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Tests (the default branch's script, the candidate's tree)
        run: bash "$RUNNER_TEMP/sheepdog-tests.sh"

  review:
    concurrency:
      group: ${{ github.event.workflow_run.head_branch == inputs.main-branch && 'review-main-reviewer' || format('review-job-{0}', github.run_id) }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.head_branch == inputs.dev-branch ||
       (github.event.workflow_run.head_branch == inputs.main-branch && (contains(github.event.workflow_run.head_commit.message, 'Hotfix: ') || contains(github.event.workflow_run.head_commit.message, 'Train-Merge: ') || contains(github.event.workflow_run.head_commit.message, 'Review-Fix-Of: '))))
    runs-on: ${{ fromJSON(inputs.review-runs-on) }}
    permissions:
      contents: read
      statuses: write
      actions: read # the run's own pinned sheepdog sha; prior-findings.sh reads earlier review logs (the review ledger)
    timeout-minutes: ${{ inputs.review-timeout-minutes }}
    steps:
      - name: Clean workspace (a self-hosted workspace keeps files between runs)
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - name: Status pending
        run: |
          jq -n --arg url "$RUN_URL" '{state: "pending", context: "review/blocking", description: "gates + code review running", target_url: $url}' |
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d @- >/dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The pinned sheepdog sha, from GitHub's record of this run (referenced_workflows), not from any input: a caller
      # that references this workflow by a tag or branch is refused (fail closed) — callers pin a full commit sha.
      #   sheepdog reviewing ITSELF (the caller is sheepdog's self-review.yml, which calls ./.github/workflows/review.yml):
      #   the sheepdog sha is the default-branch commit that started this run (GITHUB_WORKFLOW_SHA) — main's reviewer
      #   reviews the pushed change, as in every adopter. The caller's workflow file names the trusted runs.
      - name: Pinned sheepdog sha
        run: |
          wf=${CALLER_WORKFLOW_REF%%@*}; wf=${wf##*/}
          [[ "$wf" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]] || { echo "::error::cannot read the caller workflow file from '$CALLER_WORKFLOW_REF'"; exit 1; }
          echo "SHEEPDOG_REVIEW_WORKFLOW=$wf" >> "$GITHUB_ENV"
          if [ "$GITHUB_REPOSITORY" = "$SHEEPDOG_REPO" ]; then
            [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no workflow sha"; exit 1; }
            echo "sheepdog: reviewing itself with its default branch at $GITHUB_WORKFLOW_SHA"
            echo "SHEEPDOG_SHA=$GITHUB_WORKFLOW_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          refs=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -c '.referenced_workflows // []')
          entry=$(jq -c --arg p "$SHEEPDOG_REPO/.github/workflows/review.yml@" '[.[] | select(.path | startswith($p))][0] // empty' <<<"$refs")
          [ -n "$entry" ] || { echo "::error::this run does not reference $SHEEPDOG_REPO/.github/workflows/review.yml"; exit 1; }
          sha=$(jq -r .sha <<<"$entry"); ref=$(jq -r '.path | sub("^.*@"; "")' <<<"$entry")
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || [ "$ref" != "$sha" ]; then echo "::error::pin $SHEEPDOG_REPO by a full commit sha (got @$ref)"; exit 1; fi
          echo "sheepdog: $SHEEPDOG_REPO@$sha"
          echo "SHEEPDOG_SHA=$sha" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHEEPDOG_REPO: ${{ inputs.sheepdog-repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      - name: sheepdog (gates + reviewer, the pinned sha)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.sheepdog-repository }}
          ref: ${{ env.SHEEPDOG_SHA }}
          path: .sheepdog
          fetch-depth: 0 # a pin bump's diff (old..new) and the check that the new pin is on sheepdog's main
          persist-credentials: false
      - name: Trusted repository files (the caller's default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.main-branch }}
          path: .trusted
          persist-credentials: false
      - name: Candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: candidate
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # the reviewer runs as TypeScript with node's type stripping: no dependencies
      # The reviewed range (docs/contract.md):
      #  (a) default branch: everything since the last completed default-branch review (hotfix-review-base.sh).
      #  (b) dev: everything since the last completed dev review; a range of only Review-Fix-Of: repairs of blocked
      #      reviews is a TESTS-ONLY FIX round (kind tests-only-fix): the blocking step below is skipped, never a pass.
      #  `review-range: <base> <head>` is read by the dispatcher to attribute findings per commit.
      - name: Reviewed range
        id: range
        working-directory: candidate
        run: |
          S=../.sheepdog/scripts/ci
          kind=review
          # one default-branch boundary for this run's range scripts and its attestation
          main=$(git rev-parse "origin/$MAIN_BRANCH^{commit}"); export DEV_REVIEW_MAIN_REF=$main
          if [ "$HEAD_BRANCH" = "$MAIN_BRANCH" ]; then
            # Buffer before grep -q so a long commit message cannot give git SIGPIPE under pipefail.
            msg=$(git show -s --format=%B HEAD)
            grep -qE '^(Hotfix: [^[:space:]]|Train-Merge: [0-9a-f]{40}|Review-Fix-Of: [0-9a-f]{40})' <<<"$msg" || { echo "default-branch head without a Hotfix: / Train-Merge: / Review-Fix-Of: trailer"; exit 1; }
            base=$(bash "$S/hotfix-review-base.sh" HEAD)
            gate_base=$base
          elif [ "$HEAD_BRANCH" = "$DEV_BRANCH" ]; then
            cover=$(bash "$S/dev-review-base.sh" HEAD)
            echo "dev review: covers from ${cover:0:12} (the last completed dev review that passed or was repaired; else $MAIN_BRANCH)"
            if bash "$S/dev-review-base.sh" --only-fixes "$cover" HEAD; then kind=tests-only-fix; fi
            # Clean merges can shorten the code diff; their new commits still need all commit gates.
            gate_base=$cover
            base=$(bash "$S/dev-review-base.sh" --diff "$cover" HEAD)
          else
            base=$(git merge-base "origin/$MAIN_BRANCH" HEAD)
            gate_base=$base
          fi
          echo "review-range: $base $(git rev-parse HEAD)"
          echo "review-kind: $kind"
          git log --oneline -n 50 "$base..HEAD"
          { echo "REVIEW_BASE=$base"; echo "GATE_BASE=$gate_base"; echo "REVIEW_MAIN=$main"; } >> "$GITHUB_ENV"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEW_DEFAULT_BRANCH: ${{ inputs.main-branch }}
          DEV_BRANCH: ${{ inputs.dev-branch }}
      - name: Commit gates (sheepdog's gates + the repository's extra gate, the branch's commits)
        working-directory: candidate
        run: |
          SHEEPDOG_VERIFICATION_DIR="$GITHUB_WORKSPACE/.trusted/$VERIFICATION_DIR" SHEEPDOG_LARGE_FILES_ALLOWED="$LARGE_FILES_ALLOWED" \
            bash ../.sheepdog/scripts/ci/commit-gates.sh "$GATE_BASE" HEAD
          if [ -n "$EXTRA_GATES" ]; then bash "../.trusted/$EXTRA_GATES" "$GATE_BASE" HEAD; fi
        env:
          EXTRA_GATES: ${{ inputs.extra-gates }}
          VERIFICATION_DIR: ${{ inputs.verification-dir }}
          LARGE_FILES_ALLOWED: ${{ inputs.large-files-allowed }}
      # A range that moves this repository's sheepdog pin ships the sheepdog change old..new — the CI that tests and reviews
      # this repository from then on (docs/pin-bumps.md): the new pin must be on sheepdog's main (main moves only through
      # sheepdog's own reviewed train or a re-checked Hotfix:), and the sheepdog diff is reviewed with the range.
      - name: sheepdog pin bump (the new pin is on sheepdog's main; its diff joins the review)
        if: steps.range.outputs.kind == 'review'
        working-directory: candidate
        run: |
          re=$(sed 's/[.]/\\./g' <<<"$SHEEPDOG_REPO")
          pin_at() { git show "$1:.github/workflows/$SHEEPDOG_REVIEW_WORKFLOW" 2>/dev/null | sed -nE "s#^ *uses: $re/\\.github/workflows/review\\.yml@([0-9a-f]{40})( .*)?\$#\\1#p" | head -1; }
          old=$(pin_at "$REVIEW_BASE"); new=$(pin_at HEAD)
          if [ -z "$old" ] || [ -z "$new" ] || [ "$old" = "$new" ]; then echo "no sheepdog pin bump in this range (${old:0:12} → ${new:0:12})"; exit 0; fi
          S=$GITHUB_WORKSPACE/.sheepdog
          git -C "$S" fetch -q origin "+refs/heads/main:refs/remotes/origin/main"
          git -C "$S" cat-file -e "$old^{commit}" 2>/dev/null || git -C "$S" fetch -q origin "$old"
          git -C "$S" cat-file -e "$new^{commit}" 2>/dev/null || git -C "$S" fetch -q origin "$new"
          if ! git -C "$S" merge-base --is-ancestor "$new" origin/main; then
            echo "::error::the new sheepdog pin ${new:0:12} is not on $SHEEPDOG_REPO's main: pin only sheepdog commits that passed sheepdog's own review"; exit 1
          fi
          d=$RUNNER_TEMP/sheepdog-pin; rm -rf "$d"; mkdir -p "$d"
          git -C "$S" diff "$old" "$new" > "$d/sheepdog-pin.diff"
          git -C "$S" log --stat "$new" --not "$old" > "$d/sheepdog-pin.log"
          echo "sheepdog pin bump ${old:0:12} → ${new:0:12}: $(git -C "$S" rev-list --count "$new" --not "$old") commit(s), $(wc -l < "$d/sheepdog-pin.diff") diff line(s) join the review"
          { echo "PIN_FROM=$old"; echo "PIN_TO=$new"; } >> "$GITHUB_ENV"
        env:
          SHEEPDOG_REPO: ${{ inputs.sheepdog-repository }}
      # The isolated reviewer runs `docker run --pull=never alpine:3.20`; never `docker image prune -a` on review hosts.
      - name: Reviewer image present
        run: docker image inspect alpine:3.20 >/dev/null 2>&1 || docker pull -q alpine:3.20
      - name: Attestation (reviewed range)
        id: attest
        working-directory: candidate
        run: |
          mkdir -p ../attest
          jq -nc --arg head "$(git rev-parse HEAD)" --arg base "$REVIEW_BASE" --arg kind "$KIND" --arg main "$REVIEW_MAIN" \
            '{head: $head, base: $base, kind: $kind, main: $main}' > ../attest/review-attestation.json
          cat ../attest/review-attestation.json
        env:
          KIND: ${{ steps.range.outputs.kind }}
      # Review ledger: a range carrying review fixes (Review-Fix-Of: S) is re-reviewed with the findings that blocked S
      # and the fixers' Review-Disputed: trailers. Best effort; the token stays in this step (actions: read).
      - name: Previous findings (review ledger)
        if: steps.range.outputs.kind == 'review'
        working-directory: candidate
        run: bash ../.sheepdog/scripts/ci/prior-findings.sh "$REVIEW_BASE" HEAD > "$RUNNER_TEMP/prior-findings.txt" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEW_DEFAULT_BRANCH: ${{ inputs.main-branch }}
      # Known open findings: the dispatcher's list of findings whose fix rounds are spent (readable only where this runner
      # shares the dispatcher's host). A repeat of one that the range did not introduce or worsen is marked pre-existing.
      - name: Known open findings
        if: steps.range.outputs.kind == 'review'
        run: |
          : > "$RUNNER_TEMP/known-open.txt"
          f=$OPEN_FINDINGS
          if [ -n "$f" ] && [ -r "$f" ]; then grep -E '^review-gate: BLOCKED' "$f" | sed -E 's/^review-gate: BLOCKED (#[0-9]+ )?//' | awk '!seen[$0]++' | tail -60 > "$RUNNER_TEMP/known-open.txt" || true; fi
          echo "known open findings: $(wc -l < "$RUNNER_TEMP/known-open.txt")"
        env:
          OPEN_FINDINGS: ${{ inputs.open-findings-file }}
      # (b) a tests-only fix round: this step is SKIPPED (not a pass); review-passed.sh decides from the attestation kind.
      # The step name is part of the contract: review-passed.sh and the dispatcher look for "Review (blocking".
      - name: Review (blocking; sheepdog's reviewer, this repository's diff)
        if: steps.range.outputs.kind == 'review'
        working-directory: candidate
        run: |
          export SHEEPDOG_ENV_FILE="${REVIEWER_ENV_FILE:-${SHEEPDOG_ENV_FILE:-${FOXHOLE_ENV_PATH:-}}}"
          pin=()
          if [ -n "${PIN_TO:-}" ]; then
            pin=(--pin-repo "$SHEEPDOG_REPO" --pin-from "$PIN_FROM" --pin-to "$PIN_TO" --pin-diff "$RUNNER_TEMP/sheepdog-pin/sheepdog-pin.diff" --pin-log "$RUNNER_TEMP/sheepdog-pin/sheepdog-pin.log")
          fi
          node ../.sheepdog/reviewer/src/review-gate.ts --base "$REVIEW_BASE" --head HEAD --prior "$RUNNER_TEMP/prior-findings.txt" --known-open "$RUNNER_TEMP/known-open.txt" "${pin[@]}"
        env:
          REVIEWER_ENV_FILE: ${{ inputs.reviewer-env-file }}
          SHEEPDOG_REPO: ${{ inputs.sheepdog-repository }}
      # (d) only this run's attestation, also for a blocked review (a repaired blocked round is a link of the chain)
      - if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-attestation
          path: attest/review-attestation.json
          retention-days: 90

  # The review/blocking status (a convenience; scripts/ci/review-passed.sh is the authority).
  status:
    needs: [tests, review]
    if: >-
      !cancelled() && needs.review.result != 'cancelled' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.head_branch == inputs.dev-branch ||
       (github.event.workflow_run.head_branch == inputs.main-branch && (contains(github.event.workflow_run.head_commit.message, 'Hotfix: ') || contains(github.event.workflow_run.head_commit.message, 'Train-Merge: ') || contains(github.event.workflow_run.head_commit.message, 'Review-Fix-Of: '))))
    runs-on: ${{ fromJSON(inputs.review-runs-on) }}
    permissions:
      statuses: write
    timeout-minutes: 5
    steps:
      - name: Status result
        run: |
          state=$([ "$OUTCOME" = success ] && echo success || echo failure)
          jq -n --arg state "$state" --arg url "$RUN_URL" '{state: $state, context: "review/blocking", description: "tests + gates + review: \($state)", target_url: $url}' |
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d @- >/dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ needs.tests.result == 'success' && needs.review.result == 'success' && 'success' || 'failure' }}
