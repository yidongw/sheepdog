name: CI

# sheepdog's own CI. A PUBLIC repository: everything here runs on GitHub-hosted runners with a read-only token and no
# secrets, for pushes to main and for pull requests (forks included) alike. No self-hosted runner ever runs code from
# this repository's branches or pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tools (jq, PyYAML, socat are on the image; git identity for fixtures)
        run: |
          jq --version && python3 -c 'import yaml' && git --version
          git config --global user.name ci && git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - run: bash test/run.sh

  reviewer:
    name: reviewer (typecheck + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reviewer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: The reviewer runs with no dependencies (node type stripping)
        run: |
          rm -rf node_modules
          rc=0; node src/review-gate.ts --help || rc=$?
          test "$rc" -eq 2

  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (checksum-verified release binary)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/al.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml examples/.github/workflows/*.yml
      - name: zizmor 1.32.0 (hash-pinned wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/zz"
          echo "zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071" > "$RUNNER_TEMP/req.txt"
          "$RUNNER_TEMP/zz/bin/pip" install -q --require-hashes -r "$RUNNER_TEMP/req.txt"
          "$RUNNER_TEMP/zz/bin/zizmor" --offline --min-severity medium .github/workflows examples/.github/workflows

  # How GitHub names the jobs of a called workflow ("<caller job> / <called job>"): the verdict readers depend on it
  # (test/ci/review-contract-called.sh). This job calls a trivial reusable workflow so every CI run shows it.
  called:
    uses: ./.github/workflows/selftest-called.yml
